name: Build MINIMIZED Linux executable

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish project
        run: |
          dotnet publish FishPaper.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            -p:UseAppHost=false \
            -p:PublishSingleFile=false \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            --output publish

          cp publish/runtimes/linux-x64/native/libglfw.so.3 publish/
          chmod +x publish/FishPaper

      - name: Upload executable and GLFW
        uses: actions/upload-artifact@v4
        with:
          name: linux-executable
          path: |
            publish/FishPaper
            publish/libglfw.so.3
          if-no-files-found: error
      
      
      - name: Make executable
        run: chmod +x publish/FishPaper

      - name: Upload Linux app
        uses: actions/upload-artifact@v4
        with:
          name: minimized-fishpaper-linux-build
          path: publish/
          if-no-files-found: error